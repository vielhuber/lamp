name: lamp

services:
    app:
        build:
            context: ..
            dockerfile: docker/Dockerfile
        image: ghcr.io/vielhuber/lamp:latest
        init: true
        cap_add:
            - NET_ADMIN
        devices:
            - /dev/net/tun:/dev/net/tun
        stop_grace_period: 7m
        environment:
            LAMP_HTTPS_PORT: '8443'
        ports:
            - '127.0.0.1:18080:80'
            - '127.0.0.1:8443:443'
        healthcheck:
            test: ['CMD', 'bash', '/opt/lamp/healthcheck.sh']
            interval: 5s
            timeout: 10s
            retries: 36
            start_period: 30s
        volumes:
            - ${LAMP_DATA_DIR:-../.data}:/etc/lamp
            - ${LAMP_DATA_DIR:-../.data}/ssh:/root/.ssh
            - ${LAMP_DATA_DIR:-../.data}/cliproxyapi:/var/lib/lamp/cliproxyapi
            - type: bind
              source: /var/www
              target: /var/www
              bind:
                  create_host_path: false
            - mysql:/var/lib/mysql
            - postgresql:/var/lib/postgresql
            - redis:/var/lib/redis
            - certificates:/etc/letsencrypt
            - sites:/etc/apache2/sites-available
            - enabled-sites:/etc/apache2/sites-enabled
            - http-auth:/etc/apache2/htpasswd
            - state:/var/lib/lamp
            - mail:/var/spool/postfix

volumes:
    mysql:
    postgresql:
    redis:
    certificates:
    sites:
    enabled-sites:
    http-auth:
    state:
    mail:
